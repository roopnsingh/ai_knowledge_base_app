# ------------------------------
# Alembic Configuration File
# ------------------------------

[alembic]

# Path to migration scripts
script_location = %(here)s/alembic

# Add project root to sys.path
prepend_sys_path = .

# Use OS path separator
path_separator = os

# ------------------------------
# DATABASE CONNECTION (SYNC)
# ------------------------------

# IMPORTANT:
# Use psycopg (sync) here even if your FastAPI app uses asyncpg
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/mydatabase


# ------------------------------
# POST WRITE HOOKS (optional)
# ------------------------------

[post_write_hooks]
# Example formatting hooks (disabled by default)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


# ------------------------------
# LOGGING CONFIGURATION
# ------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
